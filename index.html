<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>portfolio</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; touch-action: none; }
      /* ponytail: KAPLAY appends its canvas straight into <body> (no `root`
         option set), so body doubles as the shared positioned container for
         canvas + #textbox-root. Upgrade path: if KAPLAY gets a dedicated
         `root` wrapper later, move `position: relative` to that element. */
      body { position: relative; }
    </style>
  </head>
  <body>
    <div id="name-entry-root"></div>
    <div id="textbox-root"></div>
    <div id="gif-overlay-root"></div>
    <div id="touch-controls-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
